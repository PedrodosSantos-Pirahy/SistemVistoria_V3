<div class="p-4 space-y-4">

  <!-- HEADER -->
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-semibold">Histórico de Vistorias</h2>

    <button
      class="px-4 py-2 rounded bg-gray-200 hover:bg-gray-300"
      (click)="voltar()">
      Voltar
    </button>
  </div>

  <!-- FILTROS -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3">

    <!-- BUSCA PLACA -->
    <input
      type="text"
      placeholder="Placa (AAA-1234)"
      class="border rounded p-2"
      [value]="buscaPlaca()"
      (input)="formatarPlacaInput($any($event.target).value)" />

    <!-- BUSCA TRANSPORTADORA -->
    <input
      type="text"
      placeholder="Transportadora"
      class="border rounded p-2"
      [value]="buscaTransp()"
      (input)="buscaTransp.set($any($event.target).value)" />

    <!-- ORDEM -->
    <select
      class="border rounded p-2"
      [value]="ordemSelecionada()"
      (change)="ordemSelecionada.set($any($event.target).value)">
      <option value="desc">Mais recentes</option>
      <option value="asc">Mais antigos</option>
    </select>

  </div>

  <!-- CONTADORES -->
  <div class="flex gap-4 text-sm">
    <span class="text-green-600">
      Concluídas: {{ totalConcluidas() }}
    </span>
    <span class="text-red-600">
      Canceladas: {{ totalCanceladas() }}
    </span>
  </div>

  <!-- LOADING / ERRO -->
  <div *ngIf="carregando()" class="text-gray-500">
    Carregando histórico...
  </div>

  <div *ngIf="erro()" class="text-red-600">
    {{ erro() }}
  </div>

  <!-- LISTA -->
<div class="space-y-2" *ngIf="!carregando()">

  <div
    *ngFor="let h of historicoFiltrado()"
    class="border rounded-lg p-4 flex justify-between items-center
           cursor-pointer select-none
           hover:bg-indigo-50 hover:border-indigo-400
           transition"
    [class.opacity-60]="!h.pdf"
    (click)="h.pdf && abrirPdf(h.pdf)">

    <!-- INFO -->
    <div>
      <div class="font-semibold text-lg">{{ h.placa }}</div>

      <div class="text-sm text-gray-600">
        {{ h.data }} • {{ h.hora }}
      </div>

      <div class="text-sm text-gray-600">
        {{ h.transportadora }}
      </div>

      <div
        class="text-sm font-medium mt-1"
        [class.text-green-600]="h.status === 'Concluida'"
        [class.text-red-600]="h.status === 'Cancelada'">
        {{ h.status }}
      </div>
    </div>

    <!-- INDICADOR PDF -->
    <div
      class="px-3 py-2 rounded text-white text-sm font-semibold"
      [class.bg-indigo-600]="h.pdf"
      [class.bg-gray-400]="!h.pdf">
      📄 PDF
    </div>

  </div>

</div>


<!-- MODAL PDF -->
<div
  *ngIf="modalAberto()"
  class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">

  <div class="bg-white w-[95%] h-[95%] rounded-lg relative overflow-hidden">

    <!-- FECHAR -->
    <button
      class="absolute top-3 right-3 bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center"
      (click)="fecharModal()">
      ✕
    </button>

    <!-- PDF -->
    <iframe
      *ngIf="pdfSelecionado()"
      [src]="pdfSelecionado()"
      class="w-full h-full"
      frameborder="0">
    </iframe>

  </div>
</div>
